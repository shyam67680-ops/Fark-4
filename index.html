<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyMusic - Professional</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#000;color:#fff;display:flex;height:100vh;overflow:hidden}
.sidebar{width:260px;background:#000;padding:8px}
.logo{padding:16px;font-size:22px;font-weight:800;display:flex;gap:10px;align-items:center}
.logo i{color:#1DB954}
.box{background:#121212;border-radius:8px;padding:8px;margin-bottom:8px}
.box p{padding:12px;color:#b3b3b3;cursor:pointer;border-radius:5px;display:flex;gap:15px;align-items:center;font-weight:600;font-size:14px}
.box p:hover,.box p.active{color:#fff;background:#232323}
.main{flex:1;background:linear-gradient(to bottom,#3a3a3a 0%,#121212 35%);overflow-y:auto;padding-bottom:90px}
.banner{padding:30px 30px 20px 30px;display:flex;gap:25px;align-items:flex-end}
.banner img{width:210px;height:210px;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.8)}
.banner h1{font-size:52px;font-weight:900;margin:10px 0;line-height:1}
.banner span{color:#fff;font-size:14px}
.controls{padding:15px 30px;display:flex;align-items:center;gap:25px}
.play{width:56px;height:56px;background:#1DB954;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-size:20px;cursor:pointer}
.player{padding:10px 20px}
iframe{border-radius:12px;border:none}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #1f1f1f;padding:12px 20px;display:flex;justify-content:space-between;font-size:12px;color:#888}
@media(max-width:768px){.sidebar{display:none}.banner{flex-direction:column;align-items:flex-start}.banner h1{font-size:32px}.banner img{width:150px;height:150px}}
</style>
</head>
<body>
<div class="sidebar">
<div class="logo"><i class="fab fa-spotify"></i> MyMusic</div>
<div class="box">
<p class="active"><i class="fas fa-home"></i> Home</p>
<p><i class="fas fa-search"></i> Search</p>
<p><i class="fas fa-book"></i> Your Library</p>
</div>
<div class="box">
<p><i class="fas fa-plus" style="background:#fff;color:#000;padding:4px;border-radius:2px"></i> Create Playlist</p>
<p><i class="fas fa-heart" style="background:linear-gradient(135deg,#450af5,#c4efd9);padding:5px;border-radius:2px"></i> Liked Songs</p>
</div>
</div>
<div class="main">
<div class="banner">
<img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500">
<div>
<span>PLAYLIST</span>
<h1>Top Hindi Hits 2026</h1>
<span>Spotify • Your Playlist Live • 50 Songs</span>
</div>
</div>
<div class="controls">
<div class="play"><i class="fas fa-play"></i></div>
<i class="far fa-heart" style="font-size:30px;color:#b3b3b3"></i>
<i class="fas fa-ellipsis-h" style="color:#b3b3b3"></i>
</div>
<div class="player">
<iframe src="https://open.spotify.com/embed/playlist/37i9dQZF1E4oJSdHZrVjxD?utm_source=generator&theme=0" width="100%" height="650" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
</div>
</div>
<div class="bottom">
<span>© 2026 MyMusic • GitHub Pages</span>
<span><i class="fab fa-spotify" style="color:#1DB954"></i> Connected to Spotify</span>
</div>
</body>
</html>
